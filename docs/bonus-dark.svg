o, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9198a1" text-anchor="start" letter-spacing="0.3">/counter     = 1</text><text x="614" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9198a1" text-anchor="start" letter-spacing="0.3">/last_eat_lock = 1</text><text x="614" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9198a1" text-anchor="start" letter-spacing="0.3">/death_lock  = 1</text><polyline points="552,183 596,183" fill="none" stroke="#6ea8fe" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="596,183 588.0,179.0 588.0,187.0" fill="#6ea8fe"/><text x="574" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9198a1" text-anchor="middle" letter-spacing="0.6">sem_wait</text><text x="0" y="292" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="14" fill="#9198a1" text-anchor="start" font-style="italic">Forks become one counting semaphore: a philosopher waits twice on /forks. Each child runs its own death-checker thread.</text></svg>